name: Android APK Build

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Check mobile public config
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_FIREBASE_MOBILE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_MOBILE_API_KEY || vars.EXPO_PUBLIC_FIREBASE_MOBILE_API_KEY }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_APPLE_SERVICE_ID: ${{ secrets.EXPO_PUBLIC_APPLE_SERVICE_ID || vars.EXPO_PUBLIC_APPLE_SERVICE_ID }}
        run: |
          node -e "const c=require('./app.config.js'); console.log(JSON.stringify({ versionCode:c.android.versionCode, firebaseProject:c.extra.firebase.projectId, hasMobileFirebaseApiKey:Boolean(process.env.EXPO_PUBLIC_FIREBASE_MOBILE_API_KEY), hasGoogleWebClientId:Boolean(c.extra.auth.googleWebClientId), hasAppleServiceId:Boolean(c.extra.auth.appleServiceId) }, null, 2))"

      - name: Sync public config to EAS preview
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EAS_TOKEN }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY || vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_MOBILE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_MOBILE_API_KEY || vars.EXPO_PUBLIC_FIREBASE_MOBILE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN || vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID || vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET || vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID || vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
          EXPO_PUBLIC_APPLE_SERVICE_ID: ${{ secrets.EXPO_PUBLIC_APPLE_SERVICE_ID || vars.EXPO_PUBLIC_APPLE_SERVICE_ID }}
          EXPO_PUBLIC_APPLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_APPLE_WEB_CLIENT_ID || vars.EXPO_PUBLIC_APPLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY || vars.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: |
          sync_env() {
            local name="$1"
            local value="${!name:-}"
            if [ -n "$value" ]; then
              eas env:create preview --name "$name" --value "$value" --visibility sensitive --force --non-interactive >/dev/null
            fi
          }
          sync_env EXPO_PUBLIC_FIREBASE_API_KEY
          sync_env EXPO_PUBLIC_FIREBASE_MOBILE_API_KEY
          sync_env EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN
          sync_env EXPO_PUBLIC_FIREBASE_PROJECT_ID
          sync_env EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET
          sync_env EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
          sync_env EXPO_PUBLIC_FIREBASE_APP_ID
          sync_env EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
          sync_env EXPO_PUBLIC_GOOGLE_CLIENT_ID
          sync_env EXPO_PUBLIC_APPLE_SERVICE_ID
          sync_env EXPO_PUBLIC_APPLE_WEB_CLIENT_ID
          sync_env EXPO_PUBLIC_GOOGLE_MAPS_API_KEY

      - name: Expo/EAS Android build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EAS_TOKEN }}
          EAS_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EAS_TOKEN }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_EAS_PROJECT_ID || vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY || vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_MOBILE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_MOBILE_API_KEY || vars.EXPO_PUBLIC_FIREBASE_MOBILE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN || vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID || vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET || vars.EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID || vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID || vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_CLIENT_ID || vars.EXPO_PUBLIC_GOOGLE_CLIENT_ID }}
          EXPO_PUBLIC_APPLE_SERVICE_ID: ${{ secrets.EXPO_PUBLIC_APPLE_SERVICE_ID || vars.EXPO_PUBLIC_APPLE_SERVICE_ID }}
          EXPO_PUBLIC_APPLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_APPLE_WEB_CLIENT_ID || vars.EXPO_PUBLIC_APPLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY || vars.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
          EXPO_PUBLIC_USE_FIREBASE_EMULATORS: "false"
        run: eas build --platform android --profile preview --non-interactive --no-wait
