name: Android AAB Build

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "firebase/**"
      - ".github/workflows/android-aab-build.yml"

jobs:
  build-android-aab:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Expo/EAS Android AAB build
        working-directory: apps/mobile
        env:
          EAS_TOKEN: ${{ secrets.EAS_TOKEN }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
        run: eas build --platform android --profile production --non-interactive --no-wait
